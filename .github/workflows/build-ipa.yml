name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repo a compilar (owner/nombre), ej: adro0303/mcqueens-web"
        required: true
      ref:
        description: "Rama, tag o commit"
        required: false
        default: "main"
      app_dir:
        description: "Carpeta dentro del repo donde esta el proyecto Expo (usa . si esta en la raiz)"
        required: false
        default: "."
      ipa_name:
        description: "Nombre del artefacto .ipa resultante"
        required: false
        default: "app-unsigned"
      runner:
        description: "Runner macOS. macos-latest = macOS 26 + Xcode 26 (SDK iOS 26). xcode-27 = macOS 27 + Xcode 27 (SDK iOS 27, imagen en preview)"
        type: choice
        required: false
        default: "macos-latest"
        options:
          - macos-latest
          - xcode-27
      xcode_version:
        description: "Xcode a usar, ej: 27.1. Vacio = el mas reciente (macos-latest) o el Xcode por defecto de la imagen (xcode-27)"
        required: false
        default: ""

jobs:
  build:
    # macos-latest = macOS 26 / Xcode 26. El label xcode-27 = macOS 27 / Xcode 27 (SDK iOS 27), imagen en preview:
    # https://github.com/actions/runner-images/issues/14404
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout target project
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: target

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Select Xcode
        env:
          XCODE_VERSION: ${{ inputs.xcode_version }}
          RUNNER_LABEL: ${{ inputs.runner }}
        run: |
          ls /Applications | grep -i Xcode
          if [ -n "$XCODE_VERSION" ]; then
            APP="/Applications/Xcode_$XCODE_VERSION.app"
          elif [ "$RUNNER_LABEL" = "xcode-27" ]; then
            # Xcode por defecto de la imagen. "El mas reciente" podria elegir una beta (ej. Xcode_27.2_beta_2.app).
            APP="/Applications/Xcode.app"
          else
            APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -n1)
          fi
          if [ ! -d "$APP" ]; then
            echo "::error::$APP no existe en este runner"
            exit 1
          fi
          echo "Using $APP"
          sudo xcode-select -s "$APP"
          xcodebuild -version
          echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      - name: Install JS dependencies
        working-directory: target/${{ inputs.app_dir }}
        run: npm install

      - name: Prebuild native iOS project
        working-directory: target/${{ inputs.app_dir }}
        run: npx expo prebuild --platform ios --non-interactive

      - name: Install CocoaPods dependencies
        working-directory: target/${{ inputs.app_dir }}/ios
        run: pod install

      - name: Find workspace and scheme
        id: target_scheme
        working-directory: target/${{ inputs.app_dir }}
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n1)
          PROJECT=$(ls -d ios/*.xcodeproj | head -n1)
          SCHEME=$(basename "$PROJECT" .xcodeproj)
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Workspace: $WORKSPACE / Scheme: $SCHEME"
          echo "All schemes in workspace (for reference):"
          xcodebuild -list -workspace "$WORKSPACE"

      - name: Build (unsigned)
        working-directory: target/${{ inputs.app_dir }}
        run: |
          xcodebuild \
            -workspace "${{ steps.target_scheme.outputs.workspace }}" \
            -scheme "${{ steps.target_scheme.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package unsigned IPA
        working-directory: target/${{ inputs.app_dir }}
        run: |
          echo "Build products:"
          find build/DerivedData/Build/Products -maxdepth 2
          APP_PATH=$(find build/DerivedData/Build/Products -maxdepth 2 -name "*.app" -type d | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found in build products"
            exit 1
          fi
          echo "Found app: $APP_PATH"
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r "${{ inputs.ipa_name }}.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.ipa_name }}
          path: target/${{ inputs.app_dir }}/build/${{ inputs.ipa_name }}.ipa
          retention-days: 14
